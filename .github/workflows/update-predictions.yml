name: Update predictions

on:
  schedule:
    - cron: "17 5 * * *"   # svaki dan u 05:17 UTC (06:17 po nasem vremenu)
  workflow_dispatch:       # dugme za rucno pokretanje na GitHub-u

permissions:
  contents: write          # dozvola da commit-uje predikcije

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Historical data and features
        run: |
          python -m src.data.fetch_history
          python -m src.data.combine
          python -m src.features.build_features

      - name: Leakage tests
        run: python -m pytest

      - name: Train model
        run: python -m src.models.train

      - name: Fetch current season
        run: python -m src.data.fetch

      - name: Predict next gameweek
        run: python -m src.models.predict

      - name: Commit predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/predictions_latest.csv
          if git diff --cached --quiet; then
            echo "Predikcije se nisu promenile."
          else
            git commit -m "Update predictions (automated)"
            git push
          fi